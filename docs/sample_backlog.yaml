features:
  - title: User Authentication
    description: Implement user authentication and authorization system
    user_stories:
      - title: User Registration
        description: As a new user, I want to register an account so that I can access the application
        acceptance_criteria: |
          - User can register with email and password
          - Password must be at least 8 characters
          - Email must be unique
          - Confirmation email is sent after registration
        tasks:
          - title: Create registration API endpoint
            description: Implement POST /api/auth/register endpoint with email/password validation
          - title: Create registration form UI
            description: Build a registration form component with client-side validation
          - title: Add email verification
            description: Send verification email after successful registration

      - title: User Login
        description: As a registered user, I want to log in so that I can access my account
        acceptance_criteria: |
          - User can log in with email and password
          - JWT token is returned on successful login
          - Invalid credentials show error message
        tasks:
          - title: Create login API endpoint
            description: Implement POST /api/auth/login endpoint that returns JWT
          - title: Create login form UI
            description: Build a login form with error handling and redirect

  - title: Dashboard
    description: Create a user dashboard showing key metrics and recent activity
    user_stories:
      - title: Dashboard Overview
        description: As a logged-in user, I want to see my dashboard with key metrics
        acceptance_criteria: |
          - Shows total projects count
          - Shows recent activity feed
          - Responsive layout
        tasks:
          - title: Create dashboard API endpoint
            description: Implement GET /api/dashboard that returns metrics and activity data
          - title: Build dashboard UI
            description: Create dashboard page with metric cards and activity timeline
